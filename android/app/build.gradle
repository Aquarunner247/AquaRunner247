apply plugin: 'com.android.application'

android {
    namespace = "com.aquarunner247.pro"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.aquarunner247.pro"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Bumped for the bundle carrying the Capacitor 8.5.3 security fix (GHSA-rvm3-566m-v7fv:
        // remote content loadable at the app origin via the internal HTTP proxy). That fix is
        // native, so it reaches users only in a new signed bundle -- a web deploy cannot carry it.
        // Play rejects a versionCode it has already seen, and 4 was uploaded on 2026-10-31.
        // versionName stays "1.0": it is what a user sees, and the launch version is still 1.0
        // however many bundles it took to get there.
        versionCode 5
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Release signing, read from android/keystore.properties -- which is gitignored, because it
    // holds the upload key's passwords. Losing that key is recoverable through Play App Signing;
    // publishing it is not.
    //
    // Absent properties file means the release build stays UNSIGNED rather than failing: a
    // checkout without the keystore (CI, a fresh clone, anyone but the release machine) still
    // has to be able to compile. An unsigned bundle is obvious the moment Play rejects it; a
    // build that cannot run at all is a worse way to find that out.
    signingConfigs {
        release {
            def props = new Properties()
            def propsFile = rootProject.file('keystore.properties')
            if (propsFile.exists()) {
                props.load(new FileInputStream(propsFile))
                // rootProject.file, NOT file(): inside the :app module, file() resolves against
                // android/app/, so a keystore sitting beside keystore.properties in android/
                // would not be found and the error names a path nobody chose.
                storeFile rootProject.file(props['storeFile'])
                storePassword props['storePassword']
                keyAlias props['keyAlias']
                keyPassword props['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            if (rootProject.file('keystore.properties').exists()) {
                signingConfig signingConfigs.release
            }
            // R8 shrinking, obfuscation and optimization. Play flags an unoptimized DEX
            // ("Obfuscation 1%") and wants this addressed by February 2027.
            //
            // Shrink and obfuscate, but deliberately NOT the -optimize default file.
            //
            // Play's warning measures OBFUSCATION ("Obfuscation 1%"), which minifyEnabled
            // delivers on its own -- 91.5% of classes renamed. The optimization pass is a
            // separate thing Play did not ask for, and it broke the camera: with
            // proguard-android-optimize.txt, R8 merged PermissionHelper's four lambdas into
            // one synthetic class (CameraPlugin$$ExternalSyntheticLambda0) and dispatched
            // getPermissionStateFn to the wrong body, so getPermissionState returned null and
            // Kotlin's platform-type null check crashed getPhoto. Verified by building the
            // same commit with minifyEnabled false, where the camera opens cleanly.
            //
            // plain proguard-android.txt carries -dontoptimize, which is exactly what we want.
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'

            // shrinkResources stays OFF deliberately. It is a separate risk with no bearing on
            // the DEX warning, and this app's web assets live in assets/ rather than res/, so
            // the win would be small while adding a second variable to the device test.
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
